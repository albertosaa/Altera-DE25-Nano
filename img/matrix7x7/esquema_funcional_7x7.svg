<text x="930" y="301" font-size="18" text-anchor="middle" font-weight="normal" fill="#182b3b">Leitura de resultados e estado</text>
<text x="55" y="355" font-size="22" text-anchor="start" font-weight="normal" fill="#182b3b">Controle: START · DONE · busy · RUNS · CYCLES       Clock: 100 MHz       Latência: 4 ciclos = 40 ns nominais</text>
<line x1="55" y1="381" x2="1545" y2="381" stroke="#b7c4cf" stroke-width="2"/>
<text x="55" y="421" font-size="28" text-anchor="start" font-weight="bold" fill="#182b3b">Detalhe de C[i,j] = Σ A[i,k] × B[k,j], com k = 0…6</text>
<text x="55" y="453" font-size="21" text-anchor="start" font-weight="normal" fill="#182b3b">Entradas inteiras de 16 bits com sinal. A célula é replicada para i e j de 0 a 6. R indica registrador.</text>
<text x="100" y="499" font-size="22" text-anchor="start" font-weight="bold" fill="#182b3b">Ciclo 1 · produtos</text>
<text x="535" y="499" font-size="22" text-anchor="start" font-weight="bold" fill="#182b3b">Ciclo 2 · pares</text>
<text x="875" y="499" font-size="22" text-anchor="start" font-weight="bold" fill="#182b3b">Ciclo 3 · grupos</text>
<text x="1230" y="499" font-size="22" text-anchor="start" font-weight="bold" fill="#182b3b">Ciclo 4 · saída</text>
<rect x="100" y="527" width="325" height="46" rx="8" fill="#e7f1fa" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="556.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p0 = A[i,0] × B[0,j]   | R32</text>
<rect x="100" y="587" width="325" height="46" rx="8" fill="#e7f1fa" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="616.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p1 = A[i,1] × B[1,j]   | R32</text>
<rect x="100" y="647" width="325" height="46" rx="8" fill="#e7f1fa" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="676.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p2 = A[i,2] × B[2,j]   | R32</text>
<rect x="100" y="707" width="325" height="46" rx="8" fill="#e7f1fa" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="736.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p3 = A[i,3] × B[3,j]   | R32</text>
<rect x="100" y="767" width="325" height="46" rx="8" fill="#e7f1fa" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="796.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p4 = A[i,4] × B[4,j]   | R32</text>
<rect x="100" y="827" width="325" height="46" rx="8" fill="#e7f1fa" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="856.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p5 = A[i,5] × B[5,j]   | R32</text>
<rect x="100" y="887" width="325" height="46" rx="8" fill="#fff0d6" stroke="#354655" stroke-width="2"/>
<text x="262.5" y="916.46" font-size="19" text-anchor="middle" font-weight="normal" fill="#182b3b">p6 = A[i,6] × B[6,j]   | R32</text>
<rect x="535" y="556" width="240" height="48" rx="8" fill="#f0f4f6" stroke="#354655" stroke-width="2"/>
<text x="655.0" y="586.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">p0 + p1  | R33</text>
<rect x="535" y="676" width="240" height="48" rx="8" fill="#f0f4f6" stroke="#354655" stroke-width="2"/>
<text x="655.0" y="706.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">p2 + p3  | R33</text>
