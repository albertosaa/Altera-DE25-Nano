<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<title>DE25-Nano: multiplicador inteiro paralelo 7 por 7</title>
<desc>Ilustração funcional do módulo matrix7_mm. Uma célula com sete produtos e três níveis de soma é replicada 49 vezes. Seis produtos por célula usam DSPs e um usa ALMs. Quatro estágios registrados a 100 MHz.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#354655"/></marker></defs>
<rect width="1600" height="1100" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182b3b">

<text x="55" y="53" font-size="34" text-anchor="start" font-weight="bold" fill="#182b3b">DE25-Nano · Multiplicação inteira paralela 7×7</text>
<text x="55" y="91" font-size="23" text-anchor="start" font-weight="normal" fill="#182b3b">Visão funcional do RTL e detalhe de uma das 49 células de saída</text>
<rect x="582" y="128" width="965" height="192" rx="12" fill="#fafcfe" stroke="#6e8293" stroke-width="2" stroke-dasharray="8 5"/>
<text x="600" y="154" font-size="20" text-anchor="start" font-weight="bold" fill="#182b3b">FPGA · matrix7_mm</text>
<rect x="45" y="180" width="235" height="95" rx="8" fill="#e7edf1" stroke="#354655" stroke-width="2"/>
<text x="162.5" y="220.48" font-size="22" text-anchor="middle" font-weight="normal" fill="#182b3b">ARM / Linux</text>
<text x="162.5" y="249.48" font-size="22" text-anchor="middle" font-weight="normal" fill="#182b3b">C e comparação</text>
<rect x="325" y="180" width="220" height="95" rx="8" fill="#edf4fa" stroke="#354655" stroke-width="2"/>
<text x="435.0" y="220.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">Ponte lightweight</text>
<text x="435.0" y="247.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">Avalon-MM · 32 bits</text>
<rect x="610" y="180" width="225" height="95" rx="8" fill="#edf4fa" stroke="#354655" stroke-width="2"/>
<text x="722.5" y="220.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">Registradores A/B</text>
<text x="722.5" y="247.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">49 × 16 bits cada</text>
<rect x="895" y="180" width="230" height="95" rx="8" fill="#edf4fa" stroke="#354655" stroke-width="2"/>
<text x="1010.0" y="220.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">49 células paralelas</text>
<text x="1010.0" y="247.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">4 estágios de cálculo</text>
<rect x="1185" y="180" width="325" height="95" rx="8" fill="#edf4fa" stroke="#354655" stroke-width="2"/>
<text x="1347.5" y="220.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">49 resultados C · 35 bits</text>
<text x="1347.5" y="247.8" font-size="20" text-anchor="middle" font-weight="normal" fill="#182b3b">Leitura com sinal em 64 bits</text>
